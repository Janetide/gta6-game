<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solmar Heat — an open-world crime game</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #14100c;
    height: 100%;
    overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #game {
    width: min(100vw, 160vh);
    height: auto;
    max-height: 100vh;
    aspect-ratio: 1280 / 800;
    display: block;
    background: #1a1200;
    cursor: crosshair;
    image-rendering: auto;
  }
</style>
</head>
<body>
<canvas id="game" width="1280" height="800"></canvas>
<script type="module" src="./src/main.js"></script>
</body>
</html>
